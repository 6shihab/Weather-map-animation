version: '3.8'

services:
  backend:
    build: ./backend
    container_name: radar-backend
    restart: always
    volumes:
      - radar_data:/app/data
    ports:
      - "7888:7888"

  frontend:
    build: ./frontend
    container_name: radar-frontend
    restart: always
    ports:
      - "7887:80"
    depends_on:
      - backend
    volumes:
      # Mount the same volume to nginx so it can serve raw images directly via alias
      - radar_data:/app/data:ro

volumes:
  radar_data:
